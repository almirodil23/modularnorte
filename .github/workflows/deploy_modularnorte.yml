name: 🚀 Deploy modularnorte.com (static site)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🧩 Checkout code
        uses: actions/checkout@v3

      - name: 🧹 Clean remote directory
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            rm -rf /var/www/vhosts/modularnorte.com/httpdocs/*

      - name: 📤 Upload ALL files to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "./**"
          target: "/var/www/vhosts/modularnorte.com/httpdocs"
          overwrite: true

      - name: 🔧 Fix permissions
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            chown -R www-data:www-data /var/www/vhosts/modularnorte.com/httpdocs
            chmod -R 755 /var/www/vhosts/modularnorte.com/httpdocs

      - name: ✅ Done
        run: echo "Deployment completed successfully 🎉"
