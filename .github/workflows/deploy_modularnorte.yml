name: 🚀 Deploy modularnorte.com (Vite Build)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🧩 Checkout
        uses: actions/checkout@v3

      - name: 🗂️ Debug initial structure
        run: ls -R .

      - name: 🏗️ Build project with Vite
        run: |
          cd modularnorte
          npm install --legacy-peer-deps
          npm run build
          echo "--- FINAL STRUCTURE ---"
          cd ..
          ls -R modularnorte

      - name: 🧹 Clean remote directory
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            rm -rf /var/www/vhosts/modularnorte.com/httpdocs/*

      - name: 📤 Upload dist
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "modularnorte/dist/**"
          target: "/var/www/vhosts/modularnorte.com/httpdocs"
          overwrite: true
          strip_components: 1

      - name: 📤 Upload public assets
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "modularnorte/public/**"
          target: "/var/www/vhosts/modularnorte.com/httpdocs"
          overwrite: true
          strip_components: 1

      - name: 🔧 Fix permissions
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            chown -R www-data:www-data /var/www/vhosts/modularnorte.com/httpdocs
            chmod -R 755 /var/www/vhosts/modularnorte.com/httpdocs

      - name: 🎉 Done
        run: echo "Deployment completed successfully!"
