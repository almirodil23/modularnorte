name: Deploy modularnorte.com

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Build project with Vite
        run: |
          cd modularnorte
          npm install --legacy-peer-deps
          npm run build
          echo "Build finished"

      - name: Clean remote directory except /api
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          set -x
          find /var/www/vhosts/modularnorte.com/httpdocs -maxdepth 1 -type d -name api -prune -o -mindepth 1 -exec rm -rf {} +

      - name: Upload dist to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "modularnorte/dist/**"
          target: "/var/www/vhosts/modularnorte.com/httpdocs"
          overwrite: true
          strip_components: 2

      - name: Fix permissions on server
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            chown -R modularnorte.com_8zmjuls33v8:psacln /var/www/vhosts/modularnorte.com/httpdocs
            chmod -R 755 /var/www/vhosts/modularnorte.com/httpdocs
