name: Deploy modularnorte.com

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Build project with Vite
        run: |
          cd modularnorte
          npm ci --legacy-peer-deps
          npm run build
          echo "Build finished"

      - name: Clean remote directory except /api
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -x
            find /var/www/vhosts/modularnorte.com/httpdocs -maxdepth 1 -type d -name api -prune -o -mindepth 1 -exec rm -rf {} +

      - name: Upload dist to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "modularnorte/dist/**,modularnorte/dist/.htaccess"
          target: "/var/www/vhosts/modularnorte.com/httpdocs"
          overwrite: true
          strip_components: 2
